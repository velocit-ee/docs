name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI-only — pytest isn't a runtime dep of the docs build, but the
          # renderer test suite needs it.
          pip install pytest

      - name: Verify engines.json drift
        # Fails if any marker-delimited region in the docs site has drifted
        # from engines.json. Fix locally with:
        #   python tools/render_engine_status.py --write
        run: python tools/render_engine_status.py --check

      - name: Sync external content (CHANGELOG, etc.)
        # Pulls the canonical CHANGELOG.md from velocit-ee/core via raw
        # github (sibling-checkout fallback only matters for local dev).
        # CORE_BRANCH defaults to main; override to test against a feature
        # branch if needed.
        run: bash tools/sync_external.sh

      - name: Test renderer
        run: |
          PYTHONPATH=. python -m pytest tools/tests/ --tb=short -q

      - name: Build docs (strict)
        # `strict: true` in mkdocs.yml means any warning fails the build —
        # broken links, missing referenced files, etc.
        run: mkdocs build --strict

      - name: Verify mirror of velocit-ee/core
        # engines.json, its schema, the renderer and the renderer's tests are
        # copied verbatim from velocit-ee/core. The drift check above only
        # proves this repo's rendered regions match *this repo's* copy — it
        # cannot see that the copy itself has fallen behind core. Without this
        # step, promoting an engine in core and forgetting to mirror leaves
        # both repos green while they disagree about the project's status.
        #
        # When a change originates in core, land it there first: this step is
        # meant to fail until core's main carries the new version.
        run: python tools/check_mirror.py
